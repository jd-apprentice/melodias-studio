[package]
name = "melodias-studio"
version = "0.1.0"
edition = "2024"
description = "TUI to turn a YouTube song into a thumbnail and a chiptune track for the channel"
license = "MIT"

[[bin]]
name = "melodias"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
